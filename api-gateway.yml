spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
          - id: order
            uri:
              http://order-service:8084
            predicates:
            - Path=/api/order/**
            filters:
            - StripPrefix=1

          - id: cart
            uri:
              http://cart-service:8083
            predicates:
            - Path=/api/cart/**
            filters:
            - StripPrefix=1
          
          - id: user
            uri:
              http://user-service:8082
            predicates:
            - Path=/api/user/**
            filters:
            - StripPrefix=1

          - id: product
            uri:
              http://product-service:8081
            predicates:
            - Path=/api/products/**
            filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true

server:
  port: 8080